<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Frontend Mentor | Social links profile</title>
  </head>

  <body>
    <main class="container">
      <section class="box">
        <figure>
          <img
            class="img"
            src="images/avatar-jessica.jpeg"
            alt="profile avatar"
          />
        </figure>

        <h1>Jessica Randall</h1>
        <div class="two">London, United Kingdom</div>
        <p class="one">"Front-end developer and avid reader."</p>

        <p class="top">GitHub</p>
        <p class="top">Frontend Mentor</p>
        <p class="top">LinkedIn</p>
        <p class="top">Twitter</p>
        <p class="top">Instagram</p>
      </section>
    </main>
    <div class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
        >Frontend Mentor</a
      >. Coded by <a href="#">Treasure Mirembe Nxazonke</a>.
    </div>
  </body>
</html>
